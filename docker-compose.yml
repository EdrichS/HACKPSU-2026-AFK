# Everything on one Docker host: the API (faces, voices, enrollment, /live, Nova) and Postgres.
#   cp .env.example .env   # then put the Anthropic and Gemini keys in
#   docker compose up -d --build
# State lives in the pgdata volume and the repo's data/ folder; see DEPLOY.md to move or back them up.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nametags
      POSTGRES_PASSWORD: nametags
      POSTGRES_DB: nametags
    ports:
      - "127.0.0.1:5433:5432"   # this host only, for local tools and the CLIs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nametags -d nametags"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build: .
    image: nametags-api
    environment:
      DATABASE_URL: postgresql://nametags:nametags@db:5432/nametags
      NAMETAGS_DATA: data   # /app/data, the repo's data/ mounted below
      NAMETAGS_CORS_ORIGINS: ${NAMETAGS_CORS_ORIGINS:-}   # empty: pages on localhost only
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}        # notes and visit summaries (facts + cards)
      GEMINI_MODEL: ${GEMINI_MODEL:-}            # empty: backend/gemini.py's default; set when that model is overloaded
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # Nova
      SPEECHMATICS_API_KEY: ${SPEECHMATICS_API_KEY:-${SPEECHMATICS:-}}  # live word-by-word captions; empty: local captions
      NAMETAGS_CAPTIONS: ${NAMETAGS_CAPTIONS:-}  # "local" keeps captions on this machine even with a key
    ports:
      - "${NAMETAGS_BIND:-127.0.0.1}:${NAMETAGS_PORT:-8000}:8000"   # this host only: the API has no login
    volumes:
      - ./data:/app/data   # photos and recordings, the same files the laptop programs use
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
