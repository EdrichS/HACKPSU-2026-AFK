<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Tags · Your name</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background-color: #F3F3F0; background-image: radial-gradient(circle, rgba(19, 20, 24, 0.09) 1px, transparent 1.6px); background-size: 22px 22px; font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #131418">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: clamp(16px, 2.2vw, 28px) clamp(20px, 5vw, 64px)">
<span style="display: inline-block; padding: 4px 9px 6px; background: rgba(19, 20, 24, 0.9); color: #FFFFFF; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 20px; font-weight: 500; line-height: 1">Name Tags</span>
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 14px; font-weight: 600; color: #5B5E66">Step 1 of 3</span>
<div aria-hidden="true" style="display: flex; gap: 4px">
<span style="width: 22px; height: 6px; border-radius: 3px; background: #131418"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #D3D4D8"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #D3D4D8"></span>
</div>
</div>
</header>

<main style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: clamp(18px, 2.2vw, 26px); width: 100%; max-width: 640px; margin: 0 auto; box-sizing: border-box; padding: 8px clamp(20px, 5vw, 32px) 16px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: clamp(30px, 3.4vw, 48px); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em">What's your name?</h1>
<p style="margin: 0; font-size: clamp(16px, 1.3vw, 19px); line-height: 1.5; color: #5B5E66; text-wrap: pretty">Your family and friends will see it when they sign up to help you.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="user-name" style="font-size: 15px; font-weight: 600">First name</label>
<input id="user-name" type="text" autocomplete="given-name" placeholder="e.g. Rose" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #CFD0D4; background: #FFFFFF; color: #131418; font-family: inherit; font-size: 17px">
</div>
</main>

<footer style="display: flex; justify-content: center; padding: 12px clamp(20px, 5vw, 64px) clamp(24px, 4vw, 44px)">
<div style="display: flex; width: 100%; max-width: 560px">
<a href="2-context.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 14px; background: #131418; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Continue<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
</div>
</footer>

</div>
</body>
</html>
