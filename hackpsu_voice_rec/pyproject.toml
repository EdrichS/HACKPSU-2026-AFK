[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackpsu-voice-rec"
version = "0.1.0"
description = "Talk into the mic, get told who is speaking. Speaker recognition with ONNX embeddings."
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
separation = ["torch>=2.2", "torchaudio>=2.2", "speechbrain>=1.0"]

[project.scripts]
voicerec = "voice_rec.cli:main"

[tool.setuptools]
packages = ["voice_rec"]
