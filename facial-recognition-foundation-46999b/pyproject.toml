# Lets the repo root install this folder as the `facerec` package (uv path dependency).
# The dependency list mirrors requirements.txt; keep the two in step.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facerec"
version = "0.1.0"
description = "Face detection and recognition on face_recognition 1.3 (dlib's ResNet encoder)."
requires-python = ">=3.10"
dependencies = [
    "face_recognition==1.3.0",
    "face_recognition_models==0.3.0",
    "dlib>=19.24",
    "setuptools<81",
    "numpy>=1.26",
    "Pillow>=10.0",
    "opencv-python>=4.8",
]

[tool.setuptools]
packages = ["facerec"]
