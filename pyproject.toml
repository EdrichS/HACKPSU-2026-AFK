[project]
name = "nametags"
version = "0.1.0"
description = "Tells a person with dementia who they are talking to."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "facerec",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "hackpsu-voice-rec",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.7",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[tool.uv]
package = false

# The face and voice packages live in this repo; editable, so edits there apply at once.
[tool.uv.sources]
facerec = { path = "facial-recognition-foundation-46999b", editable = true }
hackpsu-voice-rec = { path = "hackpsu_voice_rec", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
