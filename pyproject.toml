[project]
name = "nametags"
version = "0.1.0"
description = "Tells a person with dementia who they are talking to."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.7",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
